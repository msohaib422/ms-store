<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M.S. Store – See /frontend</title>
    <style>
      body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f5f5f5; }

      p { color: #555; }
      code { background: #f0f9ff; border: 1px solid #bfdbfe; padding: 12px 16px; border-radius: 8px; display: block; text-align: left; margin: 12px 0; font-size: 0.9rem; white-space: pre; }

    <meta property="og:image" content="https://bolt.new/static/og_default.png">

</head>
  <body>
    <div class="box">
      <h1>M.S. Store</h1>
      <p>This is the project root. The active application is in <strong>/frontend</strong>.</p>
      <p>To start the frontend:</p>
      <code>cd frontend
npm install
npm run dev</code>
      <p>To start the backend:</p>
      <code>cd backend
npm install
npm run dev</code>
